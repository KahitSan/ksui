name: Deploy

# Thin caller stub — the actual Deploy logic (local rsync + per-plugin pm2
# reload + manifest-hash kernel gate) is the reusable workflow in
# KahitSan/kplugin-workflows (plugin-deploy.yml). Update logic THERE.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-plugin-transactions
  cancel-in-progress: true

jobs:
  deploy:
    uses: KahitSan/kplugin-workflows/.github/workflows/plugin-deploy.yml@main
    with:
      plugin-name: transactions
    secrets: inherit
