name: Release

# Thin caller stub — the actual Release logic (changeset bump / back-compat
# tag / staging force-sync) is the reusable workflow in
# KahitSan/kplugin-workflows (plugin-release.yml). Update logic THERE.

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    uses: KahitSan/kplugin-workflows/.github/workflows/plugin-release.yml@main
    secrets: inherit
