name: CI

# Runs this plugin's e2e against the kernel, by CLONING the kernel (and any
# co-mounted sibling plugins) at the branch that matches this run and running it
# in dev/source mode with the plugins mounted — the same shape `/worktree` (and
# production, which runs `tsx` from source) use.
#
# Why not the prebuilt ghcr host image: that image only republishes on a kernel
# push to main (a prod deploy), so during a coordinated change it lags behind
# the kernel API the plugin needs, and the tiered `@ks-erp/kernel-*` SDK
# packages resolve from SOURCE (via tsconfig paths) rather than a built `dist`.
# Cloning the matching kernel branch tests the plugin against the REAL, current
# kernel with no image republish and no prod deploy. Co-mounted siblings (the
# plugin's manifest `ciCoMounts`) are cloned too so cross-plugin schemas/routes
# exist. Runs on the KahitSan self-hosted runner (label `kserp-plugin`).
#
# CONCURRENCY MODEL (multiple runners on one box): each runner's systemd unit
# exports KSERP_CI_PORT_BASE (4000 / 4100 / 4200 / ...). This workflow derives
# every port from that base — UI = base, API = base+1, plugin manifest ports
# shifted by (base - 4000) — exactly the way the local /worktree slots work.
# Postgres is the host's native cluster on :5432 with a per-slot database name,
# so concurrent runs never share a port OR a database. Adding a 4th runner is
# a server-side systemd unit with a new base; no repo change needed.

on:
  # CI is a PR gate only (kernel model). The release / bump / deploy chain runs
  # from release.yml's push:main trigger, decoupled from CI, so a changeset is
  # never swallowed by a path filter on the way to a release.
  pull_request:
    branches: [main, staging]
    paths: ['**', '!**/*.md', '!LICENSE', '.changeset/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: [self-hosted, kserp-plugin]
    timeout-minutes: 14
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Compute port slot + per-slot database
        # KSERP_CI_PORT_BASE comes from the runner's systemd unit. Runs on the
        # SAME runner are serialized by GitHub (one job per runner), so a slot's
        # ports/database are never contended; runs on DIFFERENT runners get
        # disjoint bases. The DB name embeds the base (slot), so setup can
        # safely drop only ITS OWN slot's leftovers from a crashed prior run.
        run: |
          BASE="${KSERP_CI_PORT_BASE:-4000}"
          {
            echo "UI_PORT=$BASE"
            echo "API_PORT=$((BASE + 1))"
            echo "PORT_OFFSET=$((BASE - 4000))"
            echo "PORT_LO=$BASE"
            echo "PORT_HI=$((BASE + 29))"
            echo "DB_NAME=ks_erp_ci_${BASE}_${{ github.run_id }}"
          } >> "$GITHUB_ENV"
          echo "slot base=$BASE ports=$BASE-$((BASE + 29)) db=ks_erp_ci_${BASE}_${{ github.run_id }}"

      - name: Clone the kernel + co-mounted sibling plugins (siblings of ../kserp)
        env:
          CLONE_TOKEN: ${{ secrets.PLUGIN_TOKEN }}
        run: |
          set -e
          # Belt-and-suspenders: GitHub Actions already masks the registered
          # PLUGIN_TOKEN secret, but mask it explicitly so a git error that echoes
          # the token-bearing clone URL can never leak it into the log.
          echo "::add-mask::$CLONE_TOKEN"
          # On the self-hosted runner, actions/checkout leaves an
          # `http.https://github.com/.extraheader` Authorization in THIS repo's
          # git config pinning github.com auth to the plugin's GITHUB_TOKEN
          # (which can't read other KahitSan repos). Clear it + any credential
          # helper per command so our URL-embedded PLUGIN_TOKEN wins.
          GITCFG=(-c "http.https://github.com/.extraheader=" -c credential.helper=)
          BASE="https://x-access-token:${CLONE_TOKEN}@github.com/KahitSan"
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          # Branch matching this run for a given repo: the PR's own branch
          # (coordinated feat/<task> shares a name), else the PR base, else
          # staging, else main — first that exists wins.
          pick_branch() {
            local repo="$1" c
            for c in "${{ github.head_ref }}" "${{ github.base_ref }}" staging main; do
              [ -z "$c" ] && continue
              if git "${GITCFG[@]}" ls-remote --exit-code --heads "$BASE/$repo.git" "$c" >/dev/null 2>&1; then
                echo "$c"; return 0
              fi
            done
            return 1
          }
          KREF="$(pick_branch kserp)" || { echo "::error::no matching kernel branch"; exit 1; }
          echo "kernel @ $KREF"
          rm -rf "$PARENT/kserp"
          git "${GITCFG[@]}" clone --depth 1 --branch "$KREF" "$BASE/kserp.git" "$PARENT/kserp"
          # Co-mounted siblings from this plugin's manifest (empty for base plugins).
          MOUNTS="$GITHUB_WORKSPACE"
          for sib in $(node -p "(require('$GITHUB_WORKSPACE/plugin.manifest.json').ciCoMounts||[]).join(' ')"); do
            REPO="kplugin_$sib"; DIR="$PARENT/$REPO"
            SREF="$(pick_branch "$REPO")" || { echo "::error::no branch for $REPO"; exit 1; }
            echo "co-mount $REPO @ $SREF"
            rm -rf "$DIR"
            git "${GITCFG[@]}" clone --depth 1 --branch "$SREF" "$BASE/$REPO.git" "$DIR"
            MOUNTS="$MOUNTS,$DIR"
          done
          echo "KSERP_PLUGINS=$MOUNTS" >> "$GITHUB_ENV"

      - name: Shift plugin manifest ports into this slot
        # Same mechanism as worktree-create.sh: the kernel both spawns and
        # proxies plugins at the port in each plugin.manifest.json (4011-4023
        # range). Plugin ports are internal — the browser only talks to the UI
        # port — so shifting them by the slot offset lets concurrent stacks
        # coexist. Targeted regex keeps the change to the single port number.
        run: |
          if [ "$PORT_OFFSET" -ne 0 ]; then
            IFS=',' read -ra MS <<< "$KSERP_PLUGINS"
            for d in "${MS[@]}"; do
              node -e '
                const fs = require("fs"), p = process.argv[1], off = +process.argv[2];
                let s = fs.readFileSync(p, "utf8"), done = false;
                s = s.replace(/("port":\s*)(\d+)/, (m, k, v) => { done = true; return k + (+v + off); });
                if (!done) { console.error("no port field in " + p); process.exit(1); }
                fs.writeFileSync(p, s);
                console.log(p + " -> " + JSON.parse(s).port);
              ' "$d/plugin.manifest.json" "$PORT_OFFSET"
            done
          fi

      - name: Create per-run database (native Postgres)
        # The host runs one native postgres:16 cluster on :5432. Each run gets
        # its own database; the name embeds the slot base, so dropping
        # leftovers here can only ever touch THIS runner's previous (crashed)
        # run — never a live sibling run on another slot.
        env:
          PGPASSWORD: postgres
        run: |
          pg_isready -h 127.0.0.1 -U postgres \
            || { echo "::error::host postgres is not up"; exit 1; }
          psql -h 127.0.0.1 -U postgres -tAc \
            "SELECT datname FROM pg_database WHERE datname LIKE 'ks_erp_ci_${UI_PORT}_%'" \
          | while read -r leftover; do
              [ -z "$leftover" ] && continue
              [ "$leftover" = "$DB_NAME" ] && continue
              echo "dropping leftover slot db: $leftover"
              psql -h 127.0.0.1 -U postgres -c "DROP DATABASE IF EXISTS \"$leftover\" WITH (FORCE)"
            done
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE \"$DB_NAME\""
          echo "DB_PORT=5432" >> "$GITHUB_ENV"

      - name: Create per-run object-storage bucket (MinIO)
        # One native MinIO serves all lanes on 127.0.0.1:9000 (CI_MINIO_* come
        # from the runner's systemd unit, same mechanism as KSERP_CI_PORT_BASE).
        # Isolation mirrors the per-run database: a bucket per run, name
        # embedding the slot base, leftovers swept for THIS slot only. The
        # S3_* vars land in $GITHUB_ENV so the dev stack (and the plugins it
        # spawns) inherit them — uploads in e2e go to MinIO, never to disk.
        run: |
          if [ -z "${CI_MINIO_ENDPOINT:-}" ]; then
            echo "::error::CI_MINIO_ENDPOINT is not set on this runner (MinIO not installed?)"; exit 1
          fi
          echo "::add-mask::$CI_MINIO_ROOT_PASSWORD"
          export MC_HOST_ci="http://${CI_MINIO_ROOT_USER}:${CI_MINIO_ROOT_PASSWORD}@127.0.0.1:9000"
          BUCKET="ci-${KSERP_CI_PORT_BASE:-4000}-${{ github.run_id }}"
          mc ls ci/ 2>/dev/null | awk '{print $NF}' | tr -d '/' \
            | grep "^ci-${KSERP_CI_PORT_BASE:-4000}-" | while read -r leftover; do
              [ -z "$leftover" ] && continue
              [ "$leftover" = "$BUCKET" ] && continue
              echo "removing leftover slot bucket: $leftover"
              mc rb --force "ci/$leftover" || true
            done
          mc mb "ci/$BUCKET"
          mc anonymous set download "ci/$BUCKET"
          {
            echo "S3_ENDPOINT=$CI_MINIO_ENDPOINT"
            echo "S3_REGION=us-east-1"
            echo "S3_BUCKET=$BUCKET"
            echo "S3_ACCESS_KEY=$CI_MINIO_ROOT_USER"
            echo "S3_SECRET_KEY=$CI_MINIO_ROOT_PASSWORD"
            echo "S3_CDN_URL=$CI_MINIO_ENDPOINT/$BUCKET"
          } >> "$GITHUB_ENV"

      - name: Install kernel deps + build the @ks-erp packages
        working-directory: ${{ github.workspace }}/../kserp
        run: |
          npm ci
          npm run build:packages

      - name: Link node_modules + build UI bundles (plugin + co-mounts)
        # Each mounted plugin shares the kernel's node_modules (same as the
        # worktree) so @ks-erp/* + the test runner resolve, and build:ui produces
        # the remote bundle the host serves at /<route>/_ui.
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          IFS=',' read -ra MS <<< "$KSERP_PLUGINS"
          for d in "${MS[@]}"; do
            ln -sfn "$PARENT/kserp/node_modules" "$d/node_modules"
            (cd "$d" && npm run build:ui)
          done
          npx playwright install chromium

      - name: Migrate, seed, and run the dev stack with the plugin(s) mounted
        working-directory: ${{ github.workspace }}/../kserp
        env:
          DB_HOST: 127.0.0.1
          # DB_PORT / DB_NAME / *_PORT / KSERP_PLUGINS come from earlier steps
          # via $GITHUB_ENV.
          DB_USER: postgres
          DB_PASSWORD: postgres
          BETTER_AUTH_SECRET: ci-dev-better-auth-secret-needs-32bytes
          KSERP_INTERNAL_SECRET: ci-dev-internal-secret-needs-32-bytesxx
          KSERP_PLUGIN_SPAWN: "1"
        run: |
          export BETTER_AUTH_URL="http://localhost:$API_PORT"
          export ALLOWED_ORIGINS="http://localhost:$UI_PORT"
          # Defensive: free THIS SLOT's ports in case a prior run on this runner
          # leaked a server (otherwise wait-on could bind to a STALE server and
          # report phantom-green). Only our own slot — other runners' ports are
          # live sibling runs.
          for p in $(seq "$PORT_LO" "$PORT_HI"); do fuser -k "$p/tcp" 2>/dev/null || true; done
          npm run db:migrate
          npm run db:seed
          # setsid so the whole dev tree (concurrently + vinxi + tsx + spawned
          # plugins) becomes one process group we can kill in teardown.
          # dev:wt is the kernel's parameterized dev script (vinxi --port $PORT).
          setsid env PORT="$UI_PORT" npm run dev:wt > "/tmp/kserp-dev-${{ github.run_id }}.log" 2>&1 &
          echo "DEV_PGID=$!" >> "$GITHUB_ENV"
          ROUTE=$(node -p "require('$GITHUB_WORKSPACE/plugin.manifest.json').uiRouteBase")
          # vinxi dev cold-compiles the host shell + the plugin remote on first
          # hit, so allow a generous window.
          npx wait-on -t 240000 "http://localhost:$UI_PORT/api/health" "http://localhost:$UI_PORT/$ROUTE"

      - name: Run plugin e2e
        run: |
          export PLAYWRIGHT_BASE_URL="http://localhost:$UI_PORT"
          npx playwright test --reporter=list

      - name: Kernel dev log on failure
        if: failure()
        run: tail -250 "/tmp/kserp-dev-${{ github.run_id }}.log" || true

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          # Kill the dev process group (self-hosted runners don't reap
          # backgrounded procs), then free THIS SLOT's ports as
          # belt-and-suspenders, then drop this run's database.
          kill -- -"${DEV_PGID:-0}" 2>/dev/null || true
          for p in $(seq "${PORT_LO:-4000}" "${PORT_HI:-4029}"); do fuser -k "$p/tcp" 2>/dev/null || true; done
          [ -n "$DB_NAME" ] && psql -h 127.0.0.1 -U postgres \
            -c "DROP DATABASE IF EXISTS \"$DB_NAME\" WITH (FORCE)" || true
          # Drop this run's MinIO bucket (leftovers from crashed runs are also
          # swept at the start of the next run on this slot).
          if [ -n "${S3_BUCKET:-}" ] && [ -n "${CI_MINIO_ROOT_USER:-}" ]; then
            MC_HOST_ci="http://${CI_MINIO_ROOT_USER}:${CI_MINIO_ROOT_PASSWORD}@127.0.0.1:9000" \
              mc rb --force "ci/$S3_BUCKET" || true
          fi
