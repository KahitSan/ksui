name: CI

# Thin caller stub — the actual CI logic is the reusable workflow in
# KahitSan/kplugin-workflows (plugin-ci.yml). Update logic THERE, not here.
# Only triggers / concurrency / inputs live in this file.

on:
  # CI is a PR gate only (kernel model). The release / bump / deploy chain runs
  # from release.yml's push:main trigger, decoupled from CI, so a changeset is
  # never swallowed by a path filter on the way to a release.
  pull_request:
    branches: [main, staging]
    paths: ['**', '!**/*.md', '!LICENSE', '.changeset/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    uses: KahitSan/kplugin-workflows/.github/workflows/plugin-ci.yml@main
    with:
      object-storage: true
    secrets: inherit
